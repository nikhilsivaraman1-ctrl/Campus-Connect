<style>
:root{
  --navy:#0b2545; --navy-2:#13315c; --blue:#134074; --blue-2:#1d4e89; --blue-3:#2a6fb0; --logo:#3f87c8; --sky:#5a9bd8; --steel:#8da9c4;
  --blue-tint:#dce8f5; --blue-wash:#eef4fb; --ink:#14202f; --muted:#45546a; --line:#cfdae7; --line-2:#e2e9f2;
  --page:#f1f5fa; --surface:#fbfcfe; --red:#a4161a; --red-bg:#fbeaea; --teal:#0e7480; --gold:#a8730f; --focus:#2a6fb0;
  --r:10px; --r-sm:7px;
  --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--sans);font-size:17px;line-height:1.55;color:var(--ink);background:var(--page)}
h1,h2,h3{font-family:var(--serif);font-weight:normal;color:var(--navy);line-height:1.25;margin:0 0 .5em}
h1{font-size:2.15rem} h2{font-size:1.45rem} h3{font-size:1.2rem}
h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 .5em;font-weight:700}
p{margin:0 0 1em}
a{color:var(--blue-2);text-underline-offset:2px}
a:hover{color:var(--navy)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;padding:10px 16px;z-index:300;border-radius:var(--r-sm)}
.skip:focus{left:8px;top:8px;color:#fff}
.muted{color:var(--muted)} .small{font-size:.9rem} .hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
b,strong{font-weight:700}

/* masthead */
.masthead{background:var(--navy);color:#fff;border-bottom:4px solid var(--logo)}
.masthead-in{max-width:1440px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:18px}
.brand{color:#fff;text-decoration:none;display:flex;align-items:center;gap:12px}
.brand-logo{width:50px;height:50px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none}
.brand-logo img{width:40px;height:auto;display:block}
.brand b{font-family:var(--serif);font-weight:normal;font-size:1.6rem;display:block;line-height:1.1}
.brand-sub{font-size:.78rem;color:var(--blue-tint);text-transform:uppercase;letter-spacing:.14em;display:block}
.brand:hover{color:#fff}
.spacer{flex:1}
.who{font-size:.9rem;color:var(--blue-tint);text-align:right;line-height:1.3}
.who b{color:#fff;display:block;font-size:1rem}
.mh-link{color:#fff;font-size:.95rem;font-weight:600}
.mh-link:hover{color:var(--blue-tint)}
.mh-btn{background:transparent;color:#fff;border:1px solid var(--steel);border-radius:var(--r-sm);padding:8px 15px;font:inherit;font-size:.93rem;font-weight:600;cursor:pointer}
.mh-btn:hover{background:var(--navy-2)}
.menu-btn{display:none}

/* layout */
.layout{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:272px minmax(0,1fr);min-height:calc(100vh - 180px)}
.side{padding:26px 18px 26px 28px;border-right:1px solid var(--line)}
.side h4{margin:22px 0 8px 8px;font-size:.78rem;color:var(--blue-2)}
.side h4:first-child{margin-top:0}
.side a{display:flex;align-items:center;gap:12px;padding:8px 10px;color:var(--ink);text-decoration:none;border-radius:var(--r);font-size:1.06rem;font-weight:600;margin-bottom:2px}
.side a:hover{background:var(--blue-wash);color:var(--navy)}
.side a[aria-current=page]{background:var(--blue-tint);color:var(--navy);font-weight:700}
.side .label{flex:1}
.side .count{background:#c62828;color:#fff;font-size:.78rem;padding:1px 8px;border-radius:99px;font-weight:700}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.ico svg{width:19px;height:19px;display:block}
main{display:block;padding:28px 40px 64px;min-width:0}
main:focus{outline:none}
.public{max-width:820px;margin:0 auto;padding:44px 24px 72px}
.crumbs{font-size:.92rem;color:var(--muted);margin:0 0 6px}
.crumbs a{color:var(--muted)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
.page-head h1{margin:0}
.page-head p{margin:6px 0 0}
.title-row{display:flex;align-items:center;gap:14px}
.title-row .ico{width:44px;height:44px;border-radius:12px}
.title-row .ico svg{width:26px;height:26px}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin-bottom:22px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.panel-head h2,.panel-head h3{margin:0}
.cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:26px;align-items:start}
.cols-even{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}
.rows{list-style:none;margin:0;padding:0}
.rows li{padding:12px 0;border-top:1px solid var(--line-2)}
.rows li:first-child{border-top:none;padding-top:2px}
.row-flex{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.dl{display:grid;grid-template-columns:180px 1fr;gap:8px 18px;margin:0}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;font-weight:700}
.pre{white-space:pre-wrap}
.note{background:var(--blue-wash);border:1px solid var(--blue-tint);padding:13px 16px;border-radius:var(--r);margin-bottom:20px}
.note.warn{background:var(--red-bg);border-color:#efc5c6;color:var(--red)}
.empty{color:var(--muted);padding:6px 0 4px;font-style:italic;margin:0}
.summary{display:flex;flex-wrap:wrap;gap:10px 32px;margin:0 0 24px;padding:0;list-style:none;color:var(--muted);font-weight:600}
.summary b{font-size:1.6rem;font-family:var(--serif);font-weight:normal;color:var(--navy);margin-right:6px}
.steps-text{font-size:.85rem;color:var(--blue-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
ol.plain{padding-left:1.3em;margin:0}
ol.plain li{margin-bottom:6px}
.today{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}
.today a{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;color:var(--ink);text-decoration:none;font-weight:600;flex:1;min-width:220px}
.today a:hover{border-color:var(--blue-3);background:var(--blue-wash)}
.today small{display:block;font-weight:400;color:var(--muted);font-size:.88rem}

/* buttons */
.btn{display:inline-block;font:inherit;font-size:.95rem;font-weight:700;padding:9px 18px;border-radius:var(--r-sm);border:1px solid var(--blue-2);background:var(--surface);color:var(--blue-2);cursor:pointer;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--blue-wash);color:var(--navy)}
.btn-primary{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.btn-primary:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-bg);color:var(--red)}
.btn-sm{padding:5px 11px;font-size:.86rem}
.btn-block{display:block;width:100%;text-align:center}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{justify-content:flex-end}
.linkbtn{background:none;border:none;padding:0;font:inherit;font-weight:600;color:var(--blue-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--navy)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);font:inherit;font-size:.85rem;font-weight:700;color:var(--blue-2);padding:3px 9px;cursor:pointer}
.iconbtn:hover{border-color:var(--blue-3)}
.iconbtn:disabled{opacity:.4;cursor:not-allowed}

/* tabs and filters */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-8px 0 24px;flex-wrap:wrap}
.tabs a{padding:10px 16px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:700;font-size:1rem;border-radius:var(--r-sm) var(--r-sm) 0 0}
.tabs a:hover{color:var(--navy);background:var(--blue-wash)}
.tabs a[aria-current=page]{color:var(--navy);border-bottom-color:var(--logo)}
.tabs small{font-weight:400}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filters .lbl{font-size:.92rem;color:var(--muted);margin-right:4px;font-weight:600}
.filter{font:inherit;font-size:.9rem;font-weight:600;padding:6px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;cursor:pointer;text-decoration:none}
.filter:hover{border-color:var(--blue-3);color:var(--navy)}
.filter[aria-pressed=true],.filter[aria-current=page]{background:var(--blue-2);border-color:var(--blue-2);color:#fff}

/* tags */
.tag{font-family:var(--sans);display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:6px;background:var(--blue-tint);color:var(--navy);vertical-align:2px;letter-spacing:.02em}
.tag.dark{background:var(--navy);color:#fff}
.tag.outline{background:transparent;border:1px solid var(--steel);color:var(--blue)}
.tag.gray{background:#e2e7ee;color:#323c4a}
.tag.teal{background:#d7eef0;color:#0b5d66}
.tag.gold{background:#f6ebd3;color:#6f4b06}
.tag.green{background:#dcefe2;color:#1d5c32}
.tag.amber{background:#fbeccc;color:#7a4a00}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.live{background:#c62828;color:#fff}
.count-badge{display:inline-block;background:#c62828;color:#fff;font-size:.76rem;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:2px;font-family:var(--sans)}

/* tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.98rem}
caption{text-align:left;font-family:var(--serif);font-size:1.2rem;color:var(--navy);padding-bottom:8px}
th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--blue-2);font-weight:700;padding:9px 10px;border-bottom:2px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr.unread td{font-weight:700}
td.strong{font-weight:700;color:var(--navy)}

/* forms */
label{display:block;font-weight:700;font-size:.97rem;margin-bottom:15px}
fieldset{border:none;padding:0;margin:0 0 15px;min-width:0}
legend{font-weight:700;font-size:.97rem;margin-bottom:8px;padding:0}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],input[type=url],input[type=search],input[type=password],select,textarea{display:block;width:100%;margin-top:6px;padding:10px 12px;font:inherit;font-weight:400;color:var(--ink);background:#fff;border:1px solid #8e9fb5;border-radius:var(--r-sm)}
input:focus,select:focus,textarea:focus{outline:3px solid var(--focus);outline-offset:0;border-color:var(--blue-2)}
textarea{min-height:130px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-bottom:10px}
.check input{margin:4px 0 0;width:18px;height:18px;flex:none;accent-color:var(--blue-2)}
.check > span{flex:1;min-width:0}
.radio-row{display:flex;gap:8px 22px;flex-wrap:wrap}
.radio-row .check{margin:0}
.choice-pills{display:flex;flex-wrap:wrap;gap:8px}
.choice-pills label{margin:0;font-weight:600}
.choice-pills input{position:absolute;opacity:0;width:1px;height:1px}
.choice-pills span{display:inline-block;padding:8px 16px;border:1px solid #8e9fb5;border-radius:99px;background:#fff;cursor:pointer}
.choice-pills input:checked + span{background:var(--blue-2);border-color:var(--blue-2);color:#fff}
.choice-pills input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.box{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;max-height:270px;overflow:auto;background:#fff;margin-bottom:15px}
.box h4{margin:12px 0 6px}
.box h4:first-child{margin-top:0}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.error{color:var(--red);font-size:.95rem;font-weight:600;margin:-4px 0 12px;min-height:1.2em}

/* landing */
.choice{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:24px 26px;margin-bottom:16px}
.choice h2{margin-bottom:.3em}
.lede{font-size:1.2rem;color:var(--muted);max-width:40em}
.landing-logo{width:96px;height:auto;display:block;margin-bottom:14px}
.inside{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.inside li{padding:13px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:center}
.inside b{color:var(--navy);display:flex;align-items:center;gap:10px}

/* sports */
.month{font-family:var(--serif);font-size:1.15rem;color:var(--navy);margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.month:first-of-type{margin-top:4px}
.game{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 16px;margin-bottom:9px;cursor:pointer}
.game:hover{border-color:var(--blue-3);background:var(--blue-wash)}
.game-date{text-align:center;line-height:1.15;border-right:1px solid var(--line);padding-right:12px}
.game-date small{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.game-date b{display:block;font-family:var(--serif);font-weight:normal;font-size:1.7rem;color:var(--navy)}
.game-title{font-weight:700;font-size:1.05rem}
.game-score{font-family:var(--serif);font-size:1.6rem;color:var(--navy);white-space:nowrap}
.banner{background:var(--navy);color:#fff;border-radius:var(--r);padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.banner h2{color:#fff;margin:0}
.banner p{margin:4px 0 0;color:var(--blue-tint)}
.banner a{color:#fff}
.banner .btn{background:var(--surface);border-color:var(--surface);color:var(--navy)}
.record{display:flex;gap:26px;text-align:center}
.record b{display:block;font-family:var(--serif);font-weight:normal;font-size:1.9rem;line-height:1.1}
.record span{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--blue-tint);font-weight:700}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;background:var(--navy);color:#fff;border-radius:var(--r);padding:20px;margin-bottom:18px}
.scoreboard .team{font-size:1rem;color:var(--blue-tint);font-weight:600}
.scoreboard .score{font-family:var(--serif);font-size:3.1rem;line-height:1.1}
.scoreboard .mid{padding:0 16px;font-size:.92rem}
.scoreboard .mid b{display:block;margin-top:6px;font-size:1.02rem}
.scoreboard .tag{background:var(--surface);color:var(--navy);border-color:var(--surface)}
.stream{margin-top:16px;border:1px solid var(--line);background:var(--blue-wash);border-radius:var(--r);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* teacher help */
.subj-list{columns:3 220px;column-gap:30px;margin:0;padding:0;list-style:none}
.subj-list li{break-inside:avoid;padding:9px 0;border-bottom:1px solid var(--line-2)}
.subj-list a{font-weight:700}
.letter{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.letter-meta{padding:15px 20px;border-bottom:1px solid var(--line);background:var(--blue-wash);font-size:.97rem}
.letter-meta div{display:flex;gap:12px;padding:3px 0}
.letter-meta span{width:84px;color:var(--navy);font-weight:700;flex:none}
.letter-meta div b,.letter-meta div strong{color:var(--ink)}
.letter-body{padding:22px 26px;white-space:pre-wrap;line-height:1.7;font-family:var(--serif);font-size:1.05rem}
.group-head{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px}
.group-head h3{margin:0}
.panel > .group-head:first-child{margin-top:0}

/* events */
.event-item{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:start;padding:12px 0;border-top:1px solid var(--line-2)}
.event-item:first-child{border-top:none}
.event-date{text-align:center;background:var(--blue-wash);border-radius:var(--r-sm);padding:6px 4px;line-height:1.15}
.event-date small{display:block;font-size:.72rem;text-transform:uppercase;font-weight:700;color:var(--muted)}
.event-date b{font-family:var(--serif);font-weight:normal;font-size:1.5rem;color:var(--navy)}

/* legal */
.legal h2{margin-top:1.6em}
.legal li{margin-bottom:6px}
.legal table{margin-bottom:1em}

/* skeleton */
.sk{background:#d9e2ee;border-radius:6px;height:15px;margin:12px 0}
.sk.h{height:30px;width:38%;margin-bottom:22px}
.sk.w40{width:40%}.sk.w60{width:60%}.sk.w80{width:80%}
.sk-block{border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;margin-bottom:18px;background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.sk{animation:skp 1.8s ease-in-out infinite}}
@keyframes skp{50%{opacity:.5}}

/* modal, toast, cookie */
.modal-back{position:fixed;inset:0;background:rgba(11,37,69,.55);display:grid;place-items:center;padding:20px;z-index:100}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:600px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal.wide{max-width:800px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-head h2{margin:0;font-size:1.3rem}
.modal-body{padding:20px 22px}
#toast{position:fixed;top:16px;right:16px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:var(--r-sm);font-size:.96rem;font-weight:600;z-index:200;display:none;max-width:90vw}
#toast.show{display:block}
.cookie{position:fixed;left:0;right:0;bottom:0;background:var(--navy-2);color:#fff;z-index:150;border-top:3px solid var(--logo)}
.cookie-in{max-width:1440px;margin:0 auto;padding:14px 28px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.96rem}
.cookie-in p{margin:0;flex:1;min-width:260px}
.cookie a{color:#fff}
.cookie .btn{background:var(--surface);border-color:var(--surface);color:var(--navy)}

/* footer */
footer{border-top:1px solid var(--line);background:var(--blue-wash)}
.foot-in{max-width:1440px;margin:0 auto;padding:24px 28px 28px;font-size:.92rem;color:var(--muted)}
.foot-in p{margin:0 0 8px;max-width:62em}
.foot-in nav a{margin-right:18px;display:inline-block;margin-bottom:4px;font-weight:600}

@media (max-width:1000px){
  .layout{grid-template-columns:1fr}
  .side{display:none;border-right:none;border-bottom:1px solid var(--line);padding:14px 20px 20px;background:var(--surface)}
  body.menu-open .side{display:block}
  .menu-btn{display:inline-block}
  .who,.mh-link{display:none}
  main{padding:22px 18px 56px}
  .cols,.cols-even,.form-2,.check-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:16px}
  h1{font-size:1.7rem}
  .dl{grid-template-columns:1fr}.dl dd{margin-bottom:6px}
  .inside li{grid-template-columns:1fr;gap:4px}
  .masthead-in{padding:10px 16px;gap:10px}
  .brand-sub{display:none}
  .brand b{font-size:1.35rem}
  .brand-logo{width:42px;height:42px}.brand-logo img{width:33px}
  .scoreboard .score{font-size:2.3rem}
  .game{grid-template-columns:56px minmax(0,1fr);}
  .game-score{grid-column:2;font-size:1.3rem}
  .event-item{grid-template-columns:60px 1fr}
  .event-item .btn-row{grid-column:2}
  .title-row .ico{width:38px;height:38px}
}
</style>
</head>

function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function slug(s) { return s.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function randId() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
function firstName(n) { return (n || '').split(/\s+/)[0]; }
function values(o) { return Object.keys(o).map(function (k) { return o[k]; }); }
function uniq(a) { return a.filter(function (x, i) { return a.indexOf(x) === i; }); }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function pad(n) { return String(n).padStart(2, '0'); }

    if (!fd.get('agree')) return formErr('You need to agree to the Terms of Service and Privacy Policy to join.');
    lockBtn(f, true);
    ref('users/' + S.user.uid).set({ email: S.user.email, name: name, role: role, requestedRole: role, grade: grade, status: 'pending', clubs: [], consentAt: Date.now(), policyVersion: CONFIG.policyVersion, requestedAt: Date.now(), joinCode: code })
      .then(function () { sessionStorage.setItem('alcuinTries', 0); })
      .catch(function (e) { lockBtn(f, false); if (e.code === 'permission-denied') { failAttempt(); if (lockedOut()) render(); else formErr('That school access code is not correct.'); } else formErr('Could not send your request. Check your internet connection.'); });
  },
  adminSetup: function (f, fd) {
    var code = String(fd.get('code')).trim().toUpperCase(); if (code.length < 4) return formErr('Use at least 4 characters.');
    lockBtn(f, true);
    seedPortal(code).then(watchMe).catch(function (e) { lockBtn(f, false); console.error(e); formErr(e.code === 'permission-denied' ? 'The database refused the setup. Check that the security rules are published.' : 'Setup did not work: ' + e.message); });
  },
  annPost: function (f, fd) {
    var u = S.me, now = Date.now(), notify = !!fd.get('notify');
    var data = { title: String(fd.get('title')).trim(), category: fd.get('category'), body: String(fd.get('body')).trim(), author: u.name, authorUid: u.uid, at: now, order: now, pinned: isAdmin(u) && !!fd.get('pinned') };
    closeModal();
    save(col('announcements').add(data), 'Announcement posted').then(function (ok) {
      if (ok && notify) sendMail(Object.keys(S.profiles), data.title, data.body + '\n\nPosted by ' + data.author + ' in ' + data.category + '.', 'announcement').then(function (n) { toast(n ? 'Announcement posted and emailed to ' + n + ' member' + (n === 1 ? '' : 's') : 'Announcement posted. Nobody has email notices turned on yet.'); }).catch(function () { toast('Announcement posted, but the email notice could not be sent.'); });
    });
  },
  gameSave: function (f, fd) {
    var stream = String(fd.get('stream') || '').trim(); if (stream && !/^https:\/\//i.test(stream)) return toast('The stream link must start with https://');
    var data = { sport: fd.get('sport'), opponent: String(fd.get('opponent')).trim(), date: fd.get('date'), time: fd.get('time'), home: fd.get('home') === '1', location: String(fd.get('location')).trim(), status: fd.get('status'), us: Math.max(0, parseInt(fd.get('us'), 10) || 0), them: Math.max(0, parseInt(fd.get('them'), 10) || 0), period: String(fd.get('period')).trim(), clock: String(fd.get('clock')).trim(), stream: stream, sample: false };
    var id = f.dataset.id; closeModal(); save(id ? ref('games/' + id).set(data) : col('games').add(data), 'Game saved');
  },
  teamSave: function (f, fd) { closeModal(); save(ref('teams/' + f.dataset.team).update({ about: String(fd.get('about')).trim(), practice: String(fd.get('practice')).trim() }), 'Team information saved'); },
  teamPeopleSave: function (f, fd) { closeModal(); save(ref('teams/' + f.dataset.team).update({ coaches: fd.getAll('c'), athletes: fd.getAll('a') }), 'Team saved'); },
  addAthlete: function (f, fd) { var k = f.dataset.team, id = fd.get('student'); if (!id) return; document.activeElement.blur(); save(ref('teams/' + k).update({ athletes: athletesOf(k).concat([id]) }), nameOf(id) + ' added'); },
  inquiry: function (f, fd) {
    var u = S.me, k = f.dataset.team, coaches = coachesOf(k), to = coaches[Number(fd.get('to')) || 0]; if (!to) return toast('No coach is assigned to this team yet.');
    var body = 'Dear ' + nameOf(to) + ',\n\n' + String(fd.get('body')).trim() + '\n\nKind regards,\n' + u.name + (u.grade ? '\nGrade ' + u.grade : '');
    document.activeElement.blur();
    save(col('messages').add(messageDoc(to, String(fd.get('subject')).trim(), body, { team: k, category: fd.get('category') })), 'Inquiry sent to the ' + SPORTS[k].name + ' coaches').then(function (ok) { if (ok) f.reset(); });
  },
  interestSend: function (f, fd) { closeModal(); save(col('interests').add({ clubId: f.dataset.id, uid: S.me.uid, note: String(fd.get('note') || '').trim(), at: Date.now(), status: 'pending' }), 'Interest submitted'); },
  clubMail: function (f, fd) {
    var c = clubById(f.dataset.id); closeModal();
    sendMail(clubMembers(c), c.name + ': ' + String(fd.get('subject')).trim(), String(fd.get('body')).trim() + '\n\nSent by ' + S.me.name + ' for ' + c.name + '.', 'club', { clubId: c.id })
      .then(function (n) { toast(n ? 'Email notice sent to ' + n + ' member' + (n === 1 ? '' : 's') : 'No members have email notices turned on.'); }).catch(function (e) { console.error(e); toast('The notice could not be sent.'); });
  },
  clubSave: function (f, fd) {
    var u = S.me, c = f.dataset.id ? clubById(f.dataset.id) : null, data = {};
    ['time', 'room', 'description', 'schedule', 'extras'].forEach(function (k) { data[k] = String(fd.get(k) || '').trim(); });
    if (isAdmin(u)) { data.name = String(fd.get('name')).trim(); data.day = fd.get('day'); }
    closeModal();
    if (c) return save(ref('clubs/' + c.id).update(data), 'Club saved');
    var nid = slug(data.name) || randId(); if (clubById(nid)) nid += '-' + randId().slice(0, 4);
    data.order = Date.now(); data.itinerary = []; data.leaders = [];
    save(ref('clubs/' + nid).set(data), 'Club added');
  },
  introSave: function (f, fd) { closeModal(); save(ref('config/public').update({ clubsIntro: String(fd.get('intro')).trim() }), 'Saved'); },
  itinAdd: function (f, fd) { var c = clubById(f.dataset.id); document.activeElement.blur(); save(ref('clubs/' + c.id).update({ itinerary: (c.itinerary || []).concat([{ id: randId(), date: fd.get('date'), title: String(fd.get('title')).trim(), details: String(fd.get('details') || '').trim() }]) }), 'Itinerary item added'); },
  leadersSave: function (f, fd) { closeModal(); save(ref('clubs/' + f.dataset.id).update({ leaders: fd.getAll('leaders') }), 'Club leaders updated'); },
  teacherReq: function (f, fd) {
    var u = S.me, s = SUBJ[f.dataset.subject], req = buildRequest(u, s, fd); if (!req.to) return toast('No teacher is assigned to this class yet.');
    document.activeElement.blur();
    save(col('messages').add(messageDoc(req.to, req.subject, req.body, { course: s.id, category: req.category }))).then(function (ok) {
      if (!ok) return; f.reset(); var p = $('#previewHolder'); if (p) p.remove();
      openModal('Request sent', '<p>Your request is now on the Teacher Desk of ' + (teachersOf(s.id).length > 1 ? 'each teacher of this class' : 'your teacher') + '. Replies will appear in My correspondence.</p><div class="btn-row right"><a class="btn" href="#/teachers/mail">View my correspondence</a><button class="btn btn-primary" data-action="closeModal">Done</button></div>');
    });
  },
  compose: function (f, fd) {
    var u = S.me, to = String(fd.get('to')); if (!to) return toast('Choose who to send this to.');
    var subject = String(fd.get('subject')).trim(), text = String(fd.get('body')).trim(), course = fd.get('course') || '', tm = f.dataset.team || '';
    var people = activeStudents().filter(function (id) { return id !== u.uid; }), list;
    if (to === 'all') list = people;
    else if (to.indexOf('class:') === 0) { course = to.slice(6); list = studentsOf(course); }
    else if (to.indexOf('team:') === 0) { tm = to.slice(5); list = athletesOf(tm); }
    else if (to.indexOf('grade:') === 0) { var g = Number(to.slice(6)); list = people.filter(function (id) { return S.profiles[id].grade === g; }); }
    else list = [to];
    list = list.filter(function (id) { return id !== u.uid; });
    if (!list.length) return toast('Nobody to send to in that group yet.');
    var group = list.length > 1;
    if (group) {
      openModal('Send to ' + list.length + ' students?', '<p>Each of the ' + list.length + ' students will receive their own private copy of "' + esc(subject) + '".</p><div class="btn-row right"><button class="btn" data-action="closeModal">Cancel</button><button class="btn btn-primary" id="confirmSend">Send to ' + list.length + '</button></div>');
      $('#confirmSend').addEventListener('click', function () { closeModal(); doSend(); });
      return;
    }
    closeModal(); doSend();
    function doSend() {
      var batches = [], b = fs.batch(), n = 0;
      list.forEach(function (id) {
        var body = (/^Dear /.test(text) ? text : 'Dear ' + nameOf(id) + ',\n\n' + text); if (!/Kind regards|Best regards|Sincerely/i.test(body)) body += '\n\nKind regards,\n' + u.name;
        b.set(col('messages').doc(), messageDoc(id, subject, body, { course: course, team: tm })); n++;
        if (n % 400 === 0) { batches.push(b); b = fs.batch(); }
      });
      batches.push(b);
      save(commitAll(batches), group ? 'Message sent to ' + list.length + ' students' : 'Message sent').then(function (ok) { if (ok) location.hash = isTeacher(u) ? '#/teachers/sent' : '#/teachers/mail'; });
    }
  },
  addStudent: function (f, fd) { var sid = f.dataset.class, id = fd.get('student'); if (!id) return; document.activeElement.blur(); save(ref('classes/' + sid).update({ students: studentsOf(sid).concat([id]) }), nameOf(id) + ' added'); },
  tabSave: function (f, fd) {
    var link = String(fd.get('link') || '').trim(); if (link && !/^https:\/\//i.test(link)) return toast('Links must start with https://');
    var data = { title: String(fd.get('title')).trim(), body: String(fd.get('body') || '').trim(), link: link, linkLabel: String(fd.get('linkLabel') || '').trim() };
    var id = f.dataset.id; closeModal();
    if (id) return save(ref('eventTabs/' + id).update(data), 'Tab saved');
    data.order = S.tabs.reduce(function (m, t) { return Math.max(m, t.order || 0); }, 0) + 1; data.items = [];
    var r = col('eventTabs').doc(); save(r.set(data), 'Tab added').then(function (ok) { if (ok) location.hash = '#/events/' + r.id; });
  },
  eventAdd: function (f, fd) {
    var t = S.tabs.filter(function (x) { return x.id === f.dataset.id; })[0]; closeModal();
    save(ref('eventTabs/' + t.id).update({ items: (t.items || []).concat([{ id: randId(), date: fd.get('date'), time: String(fd.get('time') || '').trim(), title: String(fd.get('title')).trim(), place: String(fd.get('place') || '').trim(), details: String(fd.get('details') || '').trim() }]) }), 'Event added');
  },
  deleteMe: function (f, fd) {
    if (String(fd.get('confirm')).trim().toUpperCase() !== 'DELETE') return formErr('Type DELETE to confirm.');
    lockBtn(f, true);
    deleteMyAccount().catch(function (e) { console.error(e); lockBtn(f, false); formErr('Your account could not be deleted. Please try again or contact ' + CONFIG.contactEmail + '.'); });
  },
  assignSave: function (f, fd) {
    var uid = f.dataset.id, t = S.users[uid]; if (!t) return;
    var who = fd.get('who'), role = who === 'admin' ? 'admin' : who === 'teacher' ? 'teacher' : 'student', grade = role === 'student' ? Number(who) : 0;
    var subs = fd.getAll('subjects'), teaches = role !== 'student', coach = fd.getAll('coach'), ath = fd.getAll('athlete'), clubs = fd.getAll('clubs');
    var coordinator = role === 'admin' ? true : !!fd.get('coordinator');
    var b = fs.batch(), was = t.status, prof = S.profiles[uid] || {};
    SUBJECTS.forEach(function (s) {
      var tl = teachersOf(s.id).filter(function (x) { return x !== uid; }), sl = studentsOf(s.id).filter(function (x) { return x !== uid; });
      if (subs.indexOf(s.id) > -1) { if (teaches) tl.push(uid); else sl.push(uid); }
      if (tl.join() !== teachersOf(s.id).join() || sl.join() !== studentsOf(s.id).join()) b.set(ref('classes/' + s.id), { teachers: tl, students: sl });
    });
    Object.keys(SPORTS).forEach(function (k) {
      var cl = coachesOf(k).filter(function (x) { return x !== uid; }), al = athletesOf(k).filter(function (x) { return x !== uid; });
      if (coach.indexOf(k) > -1) cl.push(uid); if (ath.indexOf(k) > -1) al.push(uid);
      if (cl.join() !== coachesOf(k).join() || al.join() !== athletesOf(k).join()) b.update(ref('teams/' + k), { coaches: cl, athletes: al });
    });
    var upd = { role: role, grade: grade, status: 'approved', clubs: clubs, eventCoordinator: coordinator };
    if (t.joinCode !== undefined) upd.joinCode = firebase.firestore.FieldValue.delete();
    b.update(ref('users/' + uid), upd);
    b.set(ref('profiles/' + uid), { name: t.name, role: role, grade: grade, clubs: clubs, notify: prof.notify !== false, active: true, coordinator: coordinator });
    closeModal(); save(b.commit(), was === 'approved' ? 'Changes saved' : t.name + ' approved');
  },
  classSave: function (f, fd) { closeModal(); save(ref('classes/' + f.dataset.id).set({ teachers: fd.getAll('t'), students: fd.getAll('s') }), 'Class saved'); },
  settingsSave: function (f, fd) { document.activeElement.blur(); save(ref('config/public').update({ studentsChooseClubs: !!fd.get('choose'), sessionMinutes: Math.min(240, Math.max(5, parseInt(fd.get('mins'), 10) || 30)) }), 'Settings saved'); },
  codeSave: function (f, fd) { var code = String(fd.get('code')).trim().toUpperCase(); if (code.length < 4) return toast('Use at least 4 characters.'); document.activeElement.blur(); save(ref('private/settings').set({ schoolCode: code }), 'Access code updated'); }
};

/* =====================================================================
   INPUTS + EVENT WIRING
   ===================================================================== */
var INPUTS = {
  annSearch: function (el) { var q = el.value.toLowerCase().trim(); document.querySelectorAll('#annList .ann').forEach(function (c) { c.classList.toggle('hidden', !!q && c.dataset.text.indexOf(q) === -1); }); },
  userSearch: function (el) { var q = el.value.toLowerCase().trim(); document.querySelectorAll('.urow').forEach(function (r) { r.classList.toggle('hidden', !!q && r.dataset.text.indexOf(q) === -1); }); },
  classFilter: function (el) { ui.classFilter = el.value; render(); var s = $('#classFilter'); if (s) s.focus(); },
  msgFrom: function (el) { ui.msgFrom = el.value; render(); var s = $('#msgFrom'); if (s) s.focus(); }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]'); if (!el || !ACTIONS[el.dataset.action]) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  ACTIONS[el.dataset.action](el, e);
});
document.addEventListener('submit', function (e) { var f = e.target.closest('form[data-form]'); if (!f || !FORMS[f.dataset.form]) return; e.preventDefault(); FORMS[f.dataset.form](f, new FormData(f)); });
document.addEventListener('input', function (e) { var el = e.target.closest('[data-input]'); if (el && INPUTS[el.dataset.input] && el.tagName !== 'SELECT') INPUTS[el.dataset.input](el); });
document.addEventListener('change', function (e) { var el = e.target.closest('[data-input]'); if (el && el.tagName === 'SELECT' && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); trapFocus(e); });
window.addEventListener('hashchange', function () { closeModal(); ui.msgFrom = ''; render(); window.scrollTo(0, 0); var m = $('#main'); if (m) m.focus({ preventScroll: true }); });

boot();
})();
</script>
</body>
</html>
