<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alcuin Student Portal</title>
<meta name="description" content="A student-run portal for Alcuin School: announcements, sports, clubs, teacher help and court reservations.">
<style>
:root{
  --navy:#0b2545; --navy-2:#13315c; --blue:#134074; --blue-2:#1d4e89; --blue-3:#2a6fb0; --steel:#8da9c4;
  --blue-tint:#dce6f2; --blue-wash:#eef3f9; --ink:#15202e; --muted:#4a586d; --line:#cfd9e6; --line-2:#e1e8f0;
  --page:#f2f5f9; --surface:#fbfcfd; --red:#a4161a; --red-bg:#fbeaea; --focus:#2a6fb0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.55;color:var(--ink);background:var(--page)}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:normal;color:var(--navy);line-height:1.25;margin:0 0 .5em}
h1{font-size:2rem} h2{font-size:1.4rem} h3{font-size:1.15rem}
h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 .5em;font-weight:700}
p{margin:0 0 1em}
a{color:var(--blue-2);text-underline-offset:2px}
a:hover{color:var(--navy)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;padding:10px 16px;z-index:300}
.skip:focus{left:8px;top:8px;color:#fff}
.muted{color:var(--muted)} .small{font-size:.875rem} .hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* masthead */
.masthead{background:var(--navy);color:#fff;border-bottom:4px solid var(--blue-3)}
.masthead-in{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:18px}
.brand{color:#fff;text-decoration:none;display:flex;align-items:baseline;gap:10px}
.brand b{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:1.5rem}
.brand span{font-size:.8rem;color:var(--blue-tint);text-transform:uppercase;letter-spacing:.14em}
.brand:hover{color:#fff}
.spacer{flex:1}
.who{font-size:.875rem;color:var(--blue-tint);text-align:right;line-height:1.3}
.who b{color:#fff;font-weight:600;display:block;font-size:.95rem}
.mh-link{color:#fff;font-size:.93rem}
.mh-link:hover{color:var(--blue-tint)}
.mh-btn{background:transparent;color:#fff;border:1px solid var(--steel);border-radius:3px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.mh-btn:hover{background:var(--navy-2)}
.menu-btn{display:none}

/* layout */
.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 170px)}
.side{padding:24px 16px 24px 24px;border-right:1px solid var(--line)}
.side h4{margin:20px 0 6px 10px}
.side h4:first-child{margin-top:0}
.side a{display:block;padding:7px 10px;color:var(--ink);text-decoration:none;border-radius:3px;font-size:.95rem}
.side a:hover{background:var(--blue-wash);color:var(--navy)}
.side a[aria-current=page]{background:var(--blue-tint);color:var(--navy);font-weight:700}
.side .count{float:right;background:var(--blue);color:#fff;font-size:.75rem;padding:0 7px;border-radius:2px;font-weight:700;line-height:1.7}
main{display:block;padding:26px 32px 60px;min-width:0}
main:focus{outline:none}
.public{max-width:780px;margin:0 auto;padding:40px 24px 64px}
.crumbs{font-size:.875rem;color:var(--muted);margin:0 0 6px}
.crumbs a{color:var(--muted)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px}
.page-head h1{margin:0}
.page-head p{margin:6px 0 0}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:20px 22px;margin-bottom:20px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.panel-head h2,.panel-head h3{margin:0}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}
.cols-even{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.rows{list-style:none;margin:0;padding:0}
.rows li{padding:11px 0;border-top:1px solid var(--line-2)}
.rows li:first-child{border-top:none;padding-top:2px}
.row-flex{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.dl{display:grid;grid-template-columns:170px 1fr;gap:6px 16px;margin:0}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.pre{white-space:pre-wrap}
.note{background:var(--blue-wash);border:1px solid var(--blue-tint);padding:12px 14px;border-radius:3px;margin-bottom:18px;font-size:.95rem}
.note.warn{background:var(--red-bg);border-color:#efc5c6;color:var(--red)}
.empty{color:var(--muted);padding:6px 0 4px;font-style:italic;margin:0}
.summary{display:flex;flex-wrap:wrap;gap:8px 30px;margin:0 0 22px;padding:0;list-style:none;color:var(--muted)}
.summary b{font-size:1.5rem;font-family:Georgia,"Times New Roman",serif;font-weight:normal;color:var(--navy);margin-right:6px}
.steps-text{font-size:.875rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
ol.plain{padding-left:1.3em;margin:0}
ol.plain li{margin-bottom:6px}

/* buttons */
.btn{display:inline-block;font:inherit;font-size:.93rem;font-weight:600;padding:8px 16px;border-radius:3px;border:1px solid var(--blue-2);background:var(--surface);color:var(--blue-2);cursor:pointer;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--blue-wash);color:var(--navy)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-primary:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-bg);color:var(--red)}
.btn-sm{padding:4px 10px;font-size:.85rem}
.btn-block{display:block;width:100%;text-align:center}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.right{justify-content:flex-end}
.linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--blue-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--navy)}

/* tabs and filters */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-8px 0 22px;flex-wrap:wrap}
.tabs a{padding:9px 14px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;margin-bottom:-1px;font-weight:600;font-size:.95rem}
.tabs a:hover{color:var(--navy)}
.tabs a[aria-current=page]{color:var(--navy);border-bottom-color:var(--blue)}
.tabs small{font-weight:400}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters .lbl{font-size:.875rem;color:var(--muted);margin-right:4px}
.filter{font:inherit;font-size:.875rem;padding:5px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer;text-decoration:none}
.filter:hover{border-color:var(--blue-3);color:var(--navy)}
.filter[aria-pressed=true],.filter[aria-current=page]{background:var(--blue-2);border-color:var(--blue-2);color:#fff}

/* tags */
.tag{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:inline-block;font-size:.76rem;font-weight:700;padding:1px 7px;border-radius:2px;background:var(--blue-tint);color:var(--navy);vertical-align:1px;letter-spacing:.02em}
.tag.dark{background:var(--navy);color:#fff}
.tag.outline{background:transparent;border:1px solid var(--steel);color:var(--blue)}
.tag.gray{background:#e3e7ed;color:#333d4b}
.tag.red{background:var(--red-bg);color:var(--red)}

/* tables */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
caption{text-align:left;font-family:Georgia,"Times New Roman",serif;font-size:1.15rem;color:var(--navy);padding-bottom:8px}
th{text-align:left;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr.unread td{font-weight:700}

/* forms */
label{display:block;font-weight:600;font-size:.93rem;margin-bottom:14px}
fieldset{border:none;padding:0;margin:0 0 14px;min-width:0}
legend{font-weight:600;font-size:.93rem;margin-bottom:6px;padding:0}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],input[type=url],input[type=search],input[type=password],select,textarea{display:block;width:100%;margin-top:5px;padding:9px 11px;font:inherit;font-weight:400;color:var(--ink);background:#fff;border:1px solid #8e9fb5;border-radius:3px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--focus);outline-offset:0;border-color:var(--blue-2)}
textarea{min-height:130px;resize:vertical}
.check{display:flex;gap:9px;align-items:flex-start;font-weight:400;margin-bottom:8px}
.check input{margin-top:4px;width:17px;height:17px;flex:none;accent-color:var(--blue)}
.radio-row{display:flex;gap:6px 20px;flex-wrap:wrap}
.radio-row .check{margin:0}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.box{border:1px solid var(--line);border-radius:3px;padding:12px 14px;max-height:270px;overflow:auto;background:#fff;margin-bottom:14px}
.box h4{margin:12px 0 6px}
.box h4:first-child{margin-top:0}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.error{color:var(--red);font-size:.9rem;margin:-4px 0 12px;min-height:1.2em}

/* landing */
.choice{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:22px 24px;margin-bottom:16px}
.choice h2{margin-bottom:.3em}
.lede{font-size:1.15rem;color:var(--muted);max-width:40em}
.inside{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.inside li{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:200px 1fr;gap:16px}
.inside b{color:var(--navy)}

/* sports */
.month{font-family:Georgia,"Times New Roman",serif;font-size:1.1rem;color:var(--navy);margin:26px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.month:first-of-type{margin-top:4px}
.game{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.game:hover{border-color:var(--blue-3);background:var(--blue-wash)}
.game-date{text-align:center;line-height:1.15;border-right:1px solid var(--line);padding-right:12px}
.game-date small{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.game-date b{display:block;font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:1.6rem;color:var(--navy)}
.game-title{font-weight:700}
.game-score{font-family:Georgia,"Times New Roman",serif;font-size:1.5rem;color:var(--navy);white-space:nowrap}
.banner{background:var(--navy);color:#fff;border-radius:3px;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.banner h2{color:#fff;margin:0}
.banner p{margin:4px 0 0;color:var(--blue-tint)}
.banner a{color:#fff}
.banner .btn{background:var(--surface);border-color:var(--surface);color:var(--navy)}
.record{display:flex;gap:24px;text-align:center}
.record b{display:block;font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:1.8rem;line-height:1.1}
.record span{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--blue-tint)}
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;background:var(--navy);color:#fff;border-radius:3px;padding:18px;margin-bottom:18px}
.scoreboard .team{font-size:.95rem;color:var(--blue-tint)}
.scoreboard .score{font-family:Georgia,"Times New Roman",serif;font-size:3rem;line-height:1.1}
.scoreboard .mid{padding:0 16px;font-size:.9rem}
.scoreboard .tag{background:var(--surface);color:var(--navy);border-color:var(--surface)}
.scoreboard .mid b{display:block;margin-top:6px;font-size:1rem}
.stream{margin-top:16px;border:1px solid var(--line);background:var(--blue-wash);border-radius:3px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* teacher help */
.subj-list{columns:3 220px;column-gap:28px;margin:0;padding:0;list-style:none}
.subj-list li{break-inside:avoid;padding:8px 0;border-bottom:1px solid var(--line-2)}
.subj-list a{font-weight:600}
.letter{border:1px solid var(--line);border-radius:3px;background:#fff}
.letter-meta{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--blue-wash);font-size:.92rem}
.letter-meta div{display:flex;gap:10px;padding:2px 0}
.letter-meta span{width:76px;color:var(--muted);flex:none}
.letter-body{padding:20px 24px;white-space:pre-wrap;line-height:1.7;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}

/* courts */
.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.date-btn{flex:none;min-width:64px;padding:6px 4px;text-align:center;font:inherit;border:1px solid var(--line);border-radius:3px;background:var(--surface);cursor:pointer;color:var(--ink)}
.date-btn small{display:block;font-size:.72rem;text-transform:uppercase;color:var(--muted)}
.date-btn b{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:1.3rem;color:var(--navy)}
.date-btn:hover{border-color:var(--blue-3)}
.date-btn[aria-pressed=true]{background:var(--blue);border-color:var(--blue)}
.date-btn[aria-pressed=true] small,.date-btn[aria-pressed=true] b{color:#fff}
.slot{display:block;width:100%;padding:7px 6px;font:inherit;font-size:.85rem;text-align:center;border-radius:3px;border:1px solid}
button.slot{background:var(--surface);border-color:var(--blue-3);color:var(--blue-2);cursor:pointer;font-weight:600}
button.slot:hover{background:var(--blue-2);color:#fff}
.slot.req{background:var(--blue-wash);border-color:var(--blue-tint);color:var(--blue)}
.slot.booked{background:#e3e7ed;border-color:#c9cfd8;color:#333d4b}
.slot.mine{background:var(--navy);border-color:var(--navy);color:#fff}

/* legal */
.legal h2{margin-top:1.6em}
.legal li{margin-bottom:6px}
.legal table{margin-bottom:1em}

/* skeleton */
.sk{background:#dbe3ed;border-radius:2px;height:14px;margin:12px 0}
.sk.h{height:28px;width:38%;margin-bottom:22px}
.sk.w40{width:40%}.sk.w60{width:60%}.sk.w80{width:80%}
.sk-block{border:1px solid var(--line);border-radius:3px;padding:16px 20px;margin-bottom:18px;background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.sk{animation:skp 1.8s ease-in-out infinite}}
@keyframes skp{50%{opacity:.5}}

/* modal, toast, cookie */
.modal-back{position:fixed;inset:0;background:rgba(11,37,69,.55);display:grid;place-items:center;padding:20px;z-index:100}
.modal{background:var(--surface);border-radius:3px;width:100%;max-width:580px;max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal.wide{max-width:780px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-head h2{margin:0;font-size:1.25rem}
.modal-body{padding:18px 20px}
#toast{position:fixed;top:16px;right:16px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:3px;font-size:.93rem;z-index:200;display:none;max-width:90vw}
#toast.show{display:block}
.cookie{position:fixed;left:0;right:0;bottom:0;background:var(--navy-2);color:#fff;z-index:150;border-top:3px solid var(--blue-3)}
.cookie-in{max-width:1240px;margin:0 auto;padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:.93rem}
.cookie-in p{margin:0;flex:1;min-width:260px}
.cookie a{color:#fff}
.cookie .btn{background:var(--surface);border-color:var(--surface);color:var(--navy)}

/* footer */
footer{border-top:1px solid var(--line);background:var(--blue-wash)}
.foot-in{max-width:1240px;margin:0 auto;padding:22px 24px 26px;font-size:.875rem;color:var(--muted)}
.foot-in p{margin:0 0 8px;max-width:60em}
.foot-in nav a{margin-right:16px;display:inline-block;margin-bottom:4px}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{display:none;border-right:none;border-bottom:1px solid var(--line);padding:12px 20px 18px;background:var(--surface)}
  body.menu-open .side{display:block}
  .menu-btn{display:inline-block}
  .who,.mh-link{display:none}
  main{padding:20px 18px 52px}
  .cols,.cols-even,.form-2,.check-grid{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}.dl dd{margin-bottom:6px}
  .inside li{grid-template-columns:1fr;gap:2px}
  .masthead-in{padding:12px 18px;gap:12px}
  .brand span{display:none}
  .scoreboard .score{font-size:2.2rem}
  h1{font-size:1.6rem}
}
</style>
</head>

<div id="app"></div>
<div id="modal-root"></div>
<div id="cookie-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

var meUnsub = null, dataUnsubs = [], subscribed = false;

  S.expected.push(key);

}

  listen('classes', col('classes'), function (s) { var m = {}; s.docs.forEach(function (d) { m[d.id] = d.data(); }); S.classes = m; });
  listen('profiles', col('profiles'), function (s) { var p = {}; s.docs.forEach(function (d) { p[d.id] = d.data(); }); S.profiles = p; });
  listen('clubs', col('clubs'), function (s) { S.clubs = docsOf(s).sort(function (a, b) { return (DAYS.indexOf(a.day) - DAYS.indexOf(b.day)) || ((a.order || 0) - (b.order || 0)); }); });

    listen('priv', ref('private/settings'), function (s) { S.schoolCode = s.exists ? s.data().schoolCode : ''; });

  stopAll(); S.user = user;

  var email = (user.email || '').toLowerCase(), domain = email.split('@')[1] || '';

    S.authErr = 'Please sign in with a Gmail account (an address ending in @' + CONFIG.allowedDomains.join(' or @') + ').';
    auth.signOut(); return;
  }
  S.authErr = ''; lastActive = Date.now(); S.phase = 'loading'; render();

var modalState = {}, lastFocus = null;
function openModal(title, body, opts) {
  opts = opts || {};

  modalState = opts.state || { type: 'form' };
  $('#modal-root').innerHTML = '<div class="modal-back" data-action="modalBg"><div class="modal ' + (opts.wide ? 'wide' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">' + esc(title) + '</h2><button class="btn btn-sm" data-action="closeModal">Close</button></div><div class="modal-body">' + body + '</div></div></div>';
  var f = $('#modal-root form input:not([type=hidden]), #modal-root form select, #modal-root form textarea') || $('#modal-root [data-action=closeModal]');
  if (f) f.focus();
}
function closeModal() {
  if (!$('#modal-root').innerHTML) return;
  $('#modal-root').innerHTML = ''; modalState = {};
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  if (dirty) render();
}
function trapFocus(e) {
  var m = $('#modal-root .modal'); if (!m || e.key !== 'Tab') return;
  var f = m.querySelectorAll('a[href],button:not([disabled]),input:not([type=hidden]),select,textarea');
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

  adminSetup: function (f, fd) {
    var code = String(fd.get('code')).trim().toUpperCase(); if (code.length < 4) return formErr('Use at least 4 characters.');
    lockBtn(f, true);
    seedPortal(code).then(watchMe).catch(function (e) { lockBtn(f, false); console.error(e); formErr(e.code === 'permission-denied' ? 'The database refused the setup. Check that the security rules are published.' : 'Setup did not work: ' + e.message); });
  },
  annPost: function (f, fd) { var u = S.me; closeModal(); save(col('announcements').add({ title: String(fd.get('title')).trim(), category: fd.get('category'), body: String(fd.get('body')).trim(), author: u.name, authorUid: u.uid, at: Date.now(), pinned: isAdmin(u) && !!fd.get('pinned') }), 'Announcement posted'); },
  gameSave: function (f, fd) {
    var stream = String(fd.get('stream') || '').trim(); if (stream && !/^https:\/\//i.test(stream)) return toast('The stream link must start with https://');
    var data = { sport: fd.get('sport'), opponent: String(fd.get('opponent')).trim(), date: fd.get('date'), time: fd.get('time'), home: fd.get('home') === '1', location: String(fd.get('location')).trim(), status: fd.get('status'), us: Math.max(0, parseInt(fd.get('us'), 10) || 0), them: Math.max(0, parseInt(fd.get('them'), 10) || 0), period: String(fd.get('period')).trim(), clock: String(fd.get('clock')).trim(), stream: stream, sample: false };
    var id = f.dataset.id; closeModal(); save(id ? ref('games/' + id).set(data) : col('games').add(data), 'Game saved');
  },
  interestSend: function (f, fd) { closeModal(); save(col('interests').add({ clubId: f.dataset.id, uid: S.me.uid, note: String(fd.get('note') || '').trim(), at: Date.now(), status: 'pending' }), 'Interest submitted'); },
  clubSave: function (f, fd) {
    var u = S.me, c = f.dataset.id ? clubById(f.dataset.id) : null, data = {};
    ['time', 'room', 'description', 'schedule', 'extras'].forEach(function (k) { data[k] = String(fd.get(k) || '').trim(); });
    if (isAdmin(u)) { data.name = String(fd.get('name')).trim(); data.day = fd.get('day'); }
    closeModal();
    if (c) return save(ref('clubs/' + c.id).update(data), 'Club saved');
    var nid = slug(data.name) || randId(); if (clubById(nid)) nid += '-' + randId().slice(0, 4);
    data.order = Date.now(); data.itinerary = []; data.leaders = [];
    save(ref('clubs/' + nid).set(data), 'Club added');
  },
  introSave: function (f, fd) { closeModal(); save(ref('config/public').update({ clubsIntro: String(fd.get('intro')).trim() }), 'Saved'); },
  itinAdd: function (f, fd) { var c = clubById(f.dataset.id); document.activeElement.blur(); save(ref('clubs/' + c.id).update({ itinerary: (c.itinerary || []).concat([{ id: randId(), date: fd.get('date'), title: String(fd.get('title')).trim(), details: String(fd.get('details') || '').trim() }]) }), 'Itinerary item added'); },
  leadersSave: function (f, fd) { closeModal(); save(ref('clubs/' + f.dataset.id).update({ leaders: fd.getAll('leaders') }), 'Club leaders updated'); },
  teacherReq: function (f, fd) {
    var u = S.me, s = SUBJ[f.dataset.subject], req = buildRequest(u, s, fd); if (!req.to) return toast('No teacher is assigned to this class yet.');
    var email = teacherEmail(req.to);
    if (fd.get('gmail') && email) window.open(gmailUrl(email, req.subject, req.body + '\n\n' + u.email), '_blank', 'noopener');
    document.activeElement.blur();
    save(col('messages').add({ from: u.uid, to: req.to, subject: req.subject, body: req.body, course: s.id, courseTeachers: teachersOf(s.id), category: req.category, at: Date.now(), read: false })).then(function (ok) {
      if (!ok) return; f.reset(); var p = $('#previewHolder'); if (p) p.remove();
      openModal('Request sent', '<p>Your request is now on the Teacher Desk of ' + (teachersOf(s.id).length > 1 ? 'each teacher of this class' : 'your teacher') + '.</p>' + (fd.get('gmail') && email ? '<p>A copy also opened in Gmail in a new tab. Check it and press Send there if you want it emailed too.</p>' : '') + '<div class="btn-row right"><a class="btn" href="#/teachers/mail">View my correspondence</a><button class="btn btn-primary" data-action="closeModal">Done</button></div>');
    });
  },
  compose: function (f, fd) {
    var u = S.me, to = String(fd.get('to')); if (!to) return toast('Choose who to send this to.');
    var subject = String(fd.get('subject')).trim(), body = String(fd.get('body')).trim(), course = fd.get('course') || '';
    if (!/^Dear /.test(body)) body = 'Dear ' + nameOf(to) + ',\n\n' + body;
    if (!/Kind regards|Best regards|Sincerely/i.test(body)) body += '\n\nKind regards,\n' + u.name;
    if (fd.get('gmail') && teacherEmail(to)) window.open(gmailUrl(teacherEmail(to), subject, body), '_blank', 'noopener');
    closeModal();
    save(col('messages').add({ from: u.uid, to: to, subject: subject, body: body, course: course, courseTeachers: course ? teachersOf(course) : [], at: Date.now(), read: false }), 'Message sent').then(function (ok) { if (ok) location.hash = isTeacher(u) ? '#/teachers/sent' : '#/teachers/mail'; });
  },
  addStudent: function (f, fd) { var sid = f.dataset.class, id = fd.get('student'); if (!id) return; document.activeElement.blur(); save(ref('classes/' + sid).update({ students: studentsOf(sid).concat([id]) }), nameOf(id) + ' added'); },
  courtReq: function (f, fd) {
    var u = S.me, court = COURTS[Number(f.dataset.court)], slot = f.dataset.slot;
    if (slotRes(court, ui.courtDate, slot)) { closeModal(); return toast('Sorry, someone just requested that slot.'); }
    if (S.res.filter(function (x) { return x.uid === u.uid && x.status === 'pending'; }).length >= 3 && !isAdmin(u)) return toast('You can have up to 3 requests waiting at a time.');
    closeModal();
    save(col('reservations').add({ uid: u.uid, court: court, date: ui.courtDate, slot: slot, purpose: fd.get('purpose'), players: Math.max(1, parseInt(fd.get('players'), 10) || 1), notes: String(fd.get('notes') || '').trim(), status: isAdmin(u) ? 'approved' : 'pending', at: Date.now() }), isAdmin(u) ? 'Court booked' : 'Request sent for approval');
  },
  deleteMe: function (f, fd) {
    if (String(fd.get('confirm')).trim().toUpperCase() !== 'DELETE') return formErr('Type DELETE to confirm.');
    lockBtn(f, true);
    deleteMyAccount().catch(function (e) { console.error(e); lockBtn(f, false); formErr('Your account could not be deleted. Please try again or contact ' + CONFIG.contactEmail + '.'); });
  },
  assignSave: function (f, fd) {
    var uid = f.dataset.id, t = S.users[uid]; if (!t) return;
    var role = fd.get('role'); role = role === 'admin' ? 'admin' : role === 'teacher' ? 'teacher' : 'student';
    var subs = fd.getAll('subjects'), teaches = role !== 'student', b = fs.batch(), was = t.status;
    SUBJECTS.forEach(function (s) {
      var tl = teachersOf(s.id).filter(function (x) { return x !== uid; }), sl = studentsOf(s.id).filter(function (x) { return x !== uid; });
      if (subs.indexOf(s.id) > -1) { if (teaches) tl.push(uid); else sl.push(uid); }
      if (tl.length !== teachersOf(s.id).length || sl.length !== studentsOf(s.id).length || tl.join() !== teachersOf(s.id).join() || sl.join() !== studentsOf(s.id).join()) b.set(ref('classes/' + s.id), { teachers: tl, students: sl });
    });
    var upd = { role: role, status: 'approved', clubs: fd.getAll('clubs') };
    if (t.joinCode !== undefined) upd.joinCode = firebase.firestore.FieldValue.delete();
    b.update(ref('users/' + uid), upd);
    b.set(ref('profiles/' + uid), { name: t.name, role: role, email: teaches ? t.email : '', active: true });
    closeModal(); save(b.commit(), was === 'approved' ? 'Changes saved' : t.name + ' approved');
  },
  classSave: function (f, fd) { closeModal(); save(ref('classes/' + f.dataset.id).set({ teachers: fd.getAll('t'), students: fd.getAll('s') }), 'Class saved'); },
  settingsSave: function (f, fd) { document.activeElement.blur(); save(ref('config/public').update({ studentsChooseClubs: !!fd.get('choose'), sessionMinutes: Math.min(240, Math.max(5, parseInt(fd.get('mins'), 10) || 30)) }), 'Settings saved'); },
  codeSave: function (f, fd) { var code = String(fd.get('code')).trim().toUpperCase(); if (code.length < 4) return toast('Use at least 4 characters.'); document.activeElement.blur(); save(ref('private/settings').set({ schoolCode: code }), 'Access code updated'); }
};

/* =====================================================================
   INPUTS + EVENT WIRING
   ===================================================================== */
var INPUTS = {
  annSearch: function (el) { var q = el.value.toLowerCase().trim(); document.querySelectorAll('#annList .ann').forEach(function (c) { c.classList.toggle('hidden', !!q && c.dataset.text.indexOf(q) === -1); }); },
  userSearch: function (el) { var q = el.value.toLowerCase().trim(); document.querySelectorAll('.urow').forEach(function (r) { r.classList.toggle('hidden', !!q && r.dataset.text.indexOf(q) === -1); }); },
  classFilter: function (el) { ui.classFilter = el.value; render(); var s = $('#classFilter'); if (s) s.focus(); }
};
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]'); if (!el || !ACTIONS[el.dataset.action]) return;
  if (el.tagName === 'A' && el.getAttribute('href') === '#') e.preventDefault();
  ACTIONS[el.dataset.action](el, e);
});
document.addEventListener('submit', function (e) { var f = e.target.closest('form[data-form]'); if (!f || !FORMS[f.dataset.form]) return; e.preventDefault(); FORMS[f.dataset.form](f, new FormData(f)); });
document.addEventListener('input', function (e) { var el = e.target.closest('[data-input]'); if (el && INPUTS[el.dataset.input] && el.tagName !== 'SELECT') INPUTS[el.dataset.input](el); });
document.addEventListener('change', function (e) { var el = e.target.closest('[data-input]'); if (el && el.tagName === 'SELECT' && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); trapFocus(e); });
window.addEventListener('hashchange', function () { closeModal(); render(); window.scrollTo(0, 0); var m = $('#main'); if (m) m.focus({ preventScroll: true }); });

boot();
})();
</script>
</body>
</html>
